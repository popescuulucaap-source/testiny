<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Testiny admin</title>
<link rel="icon" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- login -->
<main id="loginView" class="card login hidden">
  <img src="logo.png" alt="Testiny">
  <h2>Admin login</h2>
  <p class="muted" style="margin-bottom:1.2rem">Only you can post announcements.</p>
  <div class="field"><label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password"></div>
  <button class="btn primary" id="loginBtn" type="button" style="width:100%">Log in</button>
  <div id="loginMsg" class="msg err hidden"></div>
</main>

<!-- dashboard -->
<main id="appView" class="admin hidden">
  <div class="top">
    <a class="brand" href="/"><img src="favicon.png" alt="" width="34" height="34"><span>Testiny admin</span></a>
    <div><a class="btn small ghost" href="/" target="_blank">View site</a> <button class="btn small ghost" id="logoutBtn" type="button">Log out</button></div>
  </div>
  <div id="notices"></div>

  <div class="tabs" role="tablist">
    <button class="chip" data-tab="ann" aria-pressed="true" type="button">Announcements</button>
    <button class="chip" data-tab="cmd" aria-pressed="false" type="button">Commands</button>
    <button class="chip" data-tab="set" aria-pressed="false" type="button">Settings</button>
  </div>
  <div id="flash" class="msg hidden"></div>

  <section id="tab-ann" class="card">
    <h2 id="annHeading">New announcement</h2>
    <div class="field"><label for="aTitle">Title</label><input id="aTitle" maxlength="100"></div>
    <div class="field"><label for="aTag">Type</label>
      <select id="aTag"><option value="update">🔧 Update</option><option value="new">🆕 New</option><option value="fix">🐛 Fix</option><option value="maintenance">⚠️ Maintenance</option><option value="news">📣 News</option></select></div>
    <div class="field"><label for="aBody">Text <span id="aCount" class="muted"></span></label><textarea id="aBody" maxlength="4000"></textarea></div>
    <div class="checks">
      <label><input type="checkbox" id="aPinned"> Pin to the top</label>
      <label id="discordLabel" class="hidden"><input type="checkbox" id="aDiscord"> Also post in Discord</label>
    </div>
    <button class="btn primary" id="aSave" type="button">Post announcement</button>
    <button class="btn ghost hidden" id="aCancel" type="button">Cancel edit</button>
    <div class="list" id="annList"></div>
  </section>

  <section id="tab-cmd" class="card hidden">
    <h2>Commands</h2>
    <p class="muted" style="margin-bottom:1rem">This is the list shown on your website. Edit it so it matches your bot.</p>
    <datalist id="cats"></datalist>
    <div id="cmdRows"></div>
    <div class="checks" style="margin-top:1rem">
      <button class="btn small ghost" id="cAdd" type="button">+ Add command</button>
      <button class="btn small primary" id="cSave" type="button">Save commands</button>
      <button class="btn small danger" id="cReset" type="button">Reset to defaults</button>
    </div>
  </section>

  <section id="tab-set" class="card hidden">
    <h2>Settings</h2>
    <div class="field"><label for="sInvite">Bot invite link (the Add to Discord button)</label><input id="sInvite" placeholder="https://discord.com/oauth2/authorize?client_id=..."></div>
    <div class="field"><label for="sSupport">Support server link (optional)</label><input id="sSupport" placeholder="https://discord.gg/..."></div>
    <button class="btn primary" id="sSave" type="button">Save settings</button>
  </section>
</main>

<script src="admin.js" defer></script>
</body>
</html>
