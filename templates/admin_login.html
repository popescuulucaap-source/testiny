{% block title %}Gargand • Admin Login{% endblock %}
{% block content %}<section class="auth-card"><span class="eyebrow">RESTRICTED ACCESS</span><h1>Admin Control Room</h1><p>Enter the password configured privately in the Render environment variables.</p><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><input type="password" name="password" placeholder="Admin password" autocomplete="current-password" required><button class="gg-button gg-button-bright" type="submit">Unlock admin ↗</button>{% if error %}<div class="notice error">{{ error }}</div>{% endif %}</form></section>{% endblock %}
