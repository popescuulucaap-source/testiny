{% extends "base.html" %}
{% block title %}Nightfall • Profile{% endblock %}
{% block content %}
<section class="page-head"><span class="eyebrow">NIGHTFALL IDENTITY</span><h1>Your Night.</h1><p>Your Discord profile and customization.</p></section>
<section class="card" style="max-width:760px"><div style="display:flex;gap:16px;align-items:center"><img src="{{ user.avatar_url }}" alt="" style="width:72px;height:72px;border-radius:50%"><div><h2>{{ user.username }}</h2><p>Customize how your Nightfall profile appears.</p></div></div></section>
<section class="card" style="max-width:760px"><span class="eyebrow">CUSTOMIZE</span><h2>Make the profile yours.</h2><input id="profileBio" maxlength="160" value="{{ bio }}" placeholder="Short bio"><select id="profileTheme"><option value="default" {% if theme=="default" %}selected{% endif %}>Nightfall</option><option value="midnight" {% if theme=="midnight" %}selected{% endif %}>Midnight</option><option value="nebula" {% if theme=="nebula" %}selected{% endif %}>Nebula</option><option value="ember" {% if theme=="ember" %}selected{% endif %}>Ember</option></select><input id="profileTitle" maxlength="40" value="{{ title }}" placeholder="Profile title"><button class="btn primary" id="saveProfile">Save profile</button><p id="profileResult"></p></section>
<script>
document.getElementById('saveProfile').onclick=async()=>{const r=await fetch('/api/profile',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({bio:document.getElementById('profileBio').value,theme:document.getElementById('profileTheme').value,title:document.getElementById('profileTitle').value})});const d=await r.json();document.getElementById('profileResult').textContent=d.ok?'Profile saved.':d.error||'Could not save.'};
</script>
{% endblock %}
