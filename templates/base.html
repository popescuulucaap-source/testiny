<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Nightfall{% endblock %}</title>
  <meta name="description" content="Nightfall — powerful all-in-one Discord bot for moderation, security, tickets, invites, games and more.">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='nightfall-motion.css') }}">
</head>
<body>
<div id="nightfall-loader" class="site-loader" aria-hidden="true"><div class="loader-halo"></div><img class="loader-logo" src="{{ url_for('static', filename='nightfall-logo.svg') }}" alt="Nightfall"><div class="loader-name">NIGHTFALL</div><div class="loader-status"><span></span> LOADING</div></div>
<div class="bg-grid"></div>
<nav class="nav">
  <a class="brand" href="/"><img class="brand-logo" src="{{ url_for('static', filename='nightfall-logo.svg') }}" alt="Nightfall"><span>Nightfall</span></a>
  <div class="nav-links">
    <a href="/commands">Commands</a><a href="/guidelines">Guidelines</a><a href="/announcements">Updates</a><a href="{{ support_url }}" target="_blank" rel="noopener">Support Server</a>
    {% if session.get('user') %}<a class="nav-pill" href="/servers">Dashboard</a>{% else %}<a class="nav-pill" href="/login">Dashboard</a>{% endif %}
  </div>
</nav>
<main>{% block content %}{% endblock %}</main>
<footer><div><b>Nightfall</b><span> • Built for communities that want more.</span></div><div><a href="/guidelines">Rules & Guidelines</a><span> · </span><a href="/announcements">Updates</a></div></footer>
<script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
