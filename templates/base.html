<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Nightfall{% endblock %}</title>
  <meta name="theme-color" content="#030611">
  <meta name="description" content="Nightfall — a fresh start.">
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='nightfall-logo.svg') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='cinematic-site.css') }}?v=20261017">
  <link rel="stylesheet" href="{{ url_for('static', filename='fresh-start.css') }}?v=20261017">
</head>
<body class="nightfall-space-page">
  <div class="space-scene" aria-hidden="true">
    <div class="space-stars-photo"></div>
    <div class="space-stars space-stars-a"></div>
    <div class="space-stars space-stars-b"></div>
    <div class="space-planet planet-r136"></div>
    <div class="space-planet planet-earth"></div>
    <div class="space-planet planet-mars"></div>
    <div class="space-planet planet-jupiter"></div>
    <div class="space-planet planet-saturn"></div>
    <div class="space-planet planet-uranus"></div>
    <div class="space-planet planet-neptune"></div>
    <div class="space-planet planet-pluto"></div>
    <div class="space-planet planet-kepler16b"></div>
    <div class="space-planet planet-k218b"></div>
    <div class="space-planet planet-kepler186f"></div>
  </div>
  <main id="app">{% block content %}{% endblock %}</main>
</body>
</html>
