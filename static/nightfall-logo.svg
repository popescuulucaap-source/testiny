<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Nightfall bird</title>
  <desc id="desc">A midnight bird spreading its wings beneath a crescent moon.</desc>
  <defs>
    <radialGradient id="night" cx="35%" cy="22%" r="85%"><stop stop-color="#202451"/><stop offset=".65" stop-color="#0b1022"/><stop offset="1" stop-color="#050711"/></radialGradient>
    <linearGradient id="feather" x1=".12" y1=".12" x2=".88" y2=".92"><stop stop-color="#d7d3ff"/><stop offset=".42" stop-color="#9f8aff"/><stop offset="1" stop-color="#53e6ff"/></linearGradient>
    <linearGradient id="wing" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#9a83ff"/><stop offset="1" stop-color="#4adfff"/></linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="9" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="disc"><circle cx="256" cy="256" r="228"/></clipPath>
  </defs>
  <circle cx="256" cy="256" r="244" fill="#060811" stroke="url(#wing)" stroke-width="8"/>
  <circle cx="256" cy="256" r="228" fill="url(#night)"/>
  <g clip-path="url(#disc)">
    <circle cx="364" cy="141" r="66" fill="#d9d7ff" opacity=".9"/>
    <circle cx="390" cy="120" r="66" fill="#10142a"/>
    <g fill="#d9f8ff" opacity=".8"><path d="m113 119 5 15 15 5-15 5-5 15-5-15-15-5 15-5z"/><circle cx="398" cy="229" r="4"/><circle cx="103" cy="294" r="4"/><circle cx="372" cy="352" r="3"/></g>
    <g class="flight-wings" fill="none" stroke="url(#wing)" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
      <path stroke-width="27" d="M249 265C199 204 126 180 46 192c42 18 69 41 91 73-37-12-69-12-107-2 47 14 84 40 116 74 27 29 60 46 110 49"/>
      <path stroke-width="27" d="M263 265c50-61 123-85 203-73-42 18-69 41-91 73 37-12 69-12 107-2-47 14-84 40-116 74-27 29-60 46-110 49"/>
      <path stroke-width="9" opacity=".66" d="M72 214c54 20 91 48 124 87M49 263c63 7 107 30 148 68m242-117c-54 20-91 48-124 87m147-38c-63 7-107 30-148 68"/>
    </g>
    <g class="bird-body" filter="url(#glow)">
      <path d="M256 190c-55 32-78 86-68 143 8 46 35 78 68 98 33-20 60-52 68-98 10-57-13-111-68-143Z" fill="url(#feather)"/>
      <path d="M256 213c-30 30-45 65-40 107 4 32 19 57 40 76 21-19 36-44 40-76 5-42-10-77-40-107Z" fill="#11152a" opacity=".92"/>
      <path d="m256 254-22 20 22 13 22-13z" fill="#62eaff"/>
      <circle cx="232" cy="247" r="8" fill="#f4f3ff"/><circle cx="280" cy="247" r="8" fill="#f4f3ff"/>
      <circle cx="234" cy="247" r="3" fill="#11152a"/><circle cx="278" cy="247" r="3" fill="#11152a"/>
      <path d="M227 331c17 16 41 16 58 0" fill="none" stroke="#9b8cff" stroke-width="7" stroke-linecap="round"/>
      <path d="m219 402 37 22 37-22-37 7z" fill="#a48eff"/>
    </g>
    <path d="M60 414c67 38 137 58 196 58s129-20 196-58" fill="none" stroke="#7f75ff" stroke-opacity=".16" stroke-width="2"/>
  </g>
  <circle cx="256" cy="256" r="228" fill="none" stroke="#fff" stroke-opacity=".1" stroke-width="2"/>
  <style>
    .flight-wings{transform-origin:256px 284px;animation:wingbeat 2.4s ease-in-out infinite}
    .bird-body{transform-origin:256px 286px;animation:glide 4.8s ease-in-out infinite}
    @keyframes wingbeat{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.9)}}
    @keyframes glide{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
    @media(prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
</svg>
