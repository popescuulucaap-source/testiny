<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Nightfall</title>
  <desc id="desc">A luminous violet crescent surrounding a cyan Nightfall sigil.</desc>
  <defs>
    <radialGradient id="bg" cx="32%" cy="20%" r="90%"><stop stop-color="#25204c"/><stop offset=".58" stop-color="#0c1024"/><stop offset="1" stop-color="#050710"/></radialGradient>
    <linearGradient id="ring" x1=".12" y1=".08" x2=".9" y2=".92"><stop stop-color="#b7a1ff"/><stop offset=".45" stop-color="#845dff"/><stop offset="1" stop-color="#39ddff"/></linearGradient>
    <linearGradient id="mark" x1=".15" y1="0" x2=".9" y2="1"><stop stop-color="#c7b8ff"/><stop offset=".52" stop-color="#8e74ff"/><stop offset="1" stop-color="#4be5ff"/></linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="9" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="disc"><circle cx="256" cy="256" r="226"/></clipPath>
  </defs>
  <circle cx="256" cy="256" r="238" fill="#070914" stroke="url(#ring)" stroke-width="8"/>
  <circle cx="256" cy="256" r="226" fill="url(#bg)"/>
  <g clip-path="url(#disc)" fill="none" stroke="#9280ff" opacity=".22">
    <path d="M30 360 174 216l54 54L386 112M88 446l152-152 44 44 166-166"/>
  </g>
  <g class="stars" fill="#d6f8ff" filter="url(#glow)">
    <path d="m120 142 5 14 14 5-14 5-5 14-5-14-14-5 14-5z"/><circle cx="382" cy="171" r="4"/><circle cx="112" cy="294" r="3"/><circle cx="398" cy="337" r="5"/>
  </g>
  <g class="moon" filter="url(#glow)">
    <path d="M334 102c-13 48 4 99 43 128-18 10-39 16-61 16-70 0-126-56-126-126 0-25 7-48 20-67 5 61 55 110 117 115 3-22 5-44 7-66 0 0 0 0 0 0Z" fill="url(#mark)" opacity=".96"/>
  </g>
  <g class="sigil" fill="none" stroke="url(#mark)" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <path stroke-width="15" d="M157 339V207l99 117 99-117v132"/>
    <path stroke-width="9" opacity=".8" d="M183 365h146"/>
  </g>
  <circle cx="256" cy="256" r="226" fill="none" stroke="#fff" stroke-opacity=".09" stroke-width="2"/>
  <style>
    .moon{transform-origin:256px 256px;animation:moon-drift 7s ease-in-out infinite}
    .stars{transform-origin:256px 256px;animation:star-pulse 3s ease-in-out infinite alternate}
    .sigil{animation:sigil-glow 4s ease-in-out infinite}
    @keyframes moon-drift{50%{transform:translate(0,-8px) rotate(-3deg)}}
    @keyframes star-pulse{to{opacity:.5;transform:scale(.97)}}
    @keyframes sigil-glow{50%{opacity:.72}}
    @media(prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
</svg>

